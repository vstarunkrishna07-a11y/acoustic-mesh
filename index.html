<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic-Mesh: Web FSK Modem</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0d1117; color: #58a6ff; text-align: center; padding: 20px; }
        h1 { color: #00ff9d; text-shadow: 0 0 10px rgba(0,255,157,0.5); }
        .container { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: auto; }
        .panel { border: 1px solid #30363d; padding: 20px; border-radius: 8px; background: #161b22; }
        button { background-color: #238636; color: white; border: none; padding: 15px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 5px; }
        button:hover { background-color: #2ea043; }
        button.stop { background-color: #da3633; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; background: #010409; color: #00ff9d; border: 1px solid #30363d; font-family: monospace; font-size: 16px;}
        #rx-console { background: #010409; color: #00ff9d; height: 180px; overflow-y: auto; text-align: left; padding: 10px; border: 1px solid #30363d; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🔊 Acoustic-Mesh Modem</h1>
    <p>Self-Clocking Air-Gapped Audio Network</p>

    <div class="container">
        <!-- SENDER PANEL -->
        <div class="panel">
            <h2 style="color: #ff7b72;">📡 Sender Mode (Node A)</h2>
            <input type="text" id="payload" value="HELLO" maxlength="5" placeholder="Enter exactly 5 chars">
            <br>
            <button onclick="transmitPacket()">Transmit Data</button>
        </div>

        <!-- RECEIVER PANEL -->
        <div class="panel">
            <h2 style="color: #79c0ff;">🎧 Receiver Mode (Node B)</h2>
            <button id="btn-listen" onclick="startListening()">Start Listening</button>
            <button class="stop" onclick="stopListening()">Stop / Reset</button>
            <div id="rx-status" style="margin-top:10px; color: yellow;">Status: Idle</div>
            <div id="rx-console">Waiting for audio packets...<br></div>
        </div>
    </div>

    <script>
        // --- ACOUSTIC PROTOCOL CONSTANTS ---
        const FREQ_SYNC = 3000; 
        const FREQ_1    = 2000; 
        const FREQ_0    = 1000; 

        let audioCtx;

        // ========================================================
        // SENDER: MODULATION (Self-Clocking)
        // ========================================================
        async function transmitPacket() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            let text = document.getElementById('payload').value;
            text = text.padEnd(5, ' ').substring(0, 5); // Force 5 chars
            const packet = `12${text}`; 
            
            let binaryString = "";
            for (let i = 0; i < packet.length; i++) {
                binaryString += packet.charCodeAt(i).toString(2).padStart(8, '0');
            }

            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.connect(audioCtx.destination);
            
            let currentTime = audioCtx.currentTime;
            
            // 1. Initial Wakeup Preamble
            osc.frequency.setValueAtTime(FREQ_SYNC, currentTime);
            currentTime += 0.4; // 400ms

            // 2. Weave Clock Syncs between every Data Bit
            for (let i = 0; i < binaryString.length; i++) {
                const freq = (binaryString[i] === '1') ? FREQ_1 : FREQ_0;
                
                // Play Data Bit
                osc.frequency.setValueAtTime(freq, currentTime);
                currentTime += 0.15; // 150ms
                
                // Play Clock Sync to reset receiver state
                osc.frequency.setValueAtTime(FREQ_SYNC, currentTime);
                currentTime += 0.10; // 100ms
            }

            osc.start();
            osc.stop(currentTime);
        }

        // ========================================================
        // RECEIVER: STATE MACHINE DEMODULATION
        // ========================================================
        let analyser, microphone, rxInterval;
        let receivedBits = "";
        let recordingState = "WAIT_SYNC"; 

        async function startListening() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('rx-status').innerText = "Status: Listening for Sync Tone... 🟢";
            receivedBits = "";
            recordingState = "WAIT_SYNC";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; 
                microphone.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                const sampleRate = audioCtx.sampleRate; 
                
                rxInterval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    
                    let maxIndex = 0;
                    let maxVol = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        if(dataArray[i] > maxVol) { maxVol = dataArray[i]; maxIndex = i; }
                    }
                    
                    const dominantFreq = maxIndex * sampleRate / analyser.fftSize;
                    
                    // Volume Threshold (180 cuts out room noise)
                    if (maxVol > 180) handleFrequency(dominantFreq);
                    
                }, 30); // Poll very fast (30ms) to catch state changes instantly

            } catch (err) {
                alert("Microphone error.");
            }
        }

        function handleFrequency(freq) {
            const isSync = Math.abs(freq - FREQ_SYNC) < 300;
            const isOne  = Math.abs(freq - FREQ_1) < 300;
            const isZero = Math.abs(freq - FREQ_0) < 300;

            // STATE 1: Waiting for the 3000Hz Clock Tone
            if (recordingState === "WAIT_SYNC") {
                if (isSync) {
                    recordingState = "READ_BIT"; // Clock detected, unlock the data reader
                    if (receivedBits.length === 0) {
                        logConsole("<br>--- Incoming Packet Detected ---");
                        document.getElementById('rx-status').innerText = "Status: Receiving Data... 🔴";
                    }
                }
            } 
            // STATE 2: Waiting for a Data Bit (1000Hz or 2000Hz)
            else if (recordingState === "READ_BIT") {
                if (isOne) {
                    receivedBits += "1";
                    logConsole(`Bit ${receivedBits.length}/56 : 1`);
                    recordingState = "WAIT_SYNC"; // Lock until next clock tone
                    checkEnd();
                } else if (isZero) {
                    receivedBits += "0";
                    logConsole(`Bit ${receivedBits.length}/56 : 0`);
                    recordingState = "WAIT_SYNC"; // Lock until next clock tone
                    checkEnd();
                }
            }
        }

        function checkEnd() {
            if (receivedBits.length >= 56) {
                processPacket(receivedBits);
                receivedBits = "";
                recordingState = "WAIT_SYNC";
                document.getElementById('rx-status').innerText = "Status: Listening for Sync Tone... 🟢";
            }
        }

        function processPacket(bits) {
            let ascii = "";
            for (let i = 0; i < bits.length; i += 8) {
                let byte = bits.substring(i, i + 8);
                if(byte.length === 8) ascii += String.fromCharCode(parseInt(byte, 2));
            }
            
            let src = ascii.charAt(0);
            let dst = ascii.charAt(1);
            let payload = ascii.substring(2);
            
            logConsole(`<br><b>✅ DECODED PACKET:</b><br>[SRC: Node ${src}] [DST: Node ${dst}]<br><b>PAYLOAD: <span style="color:white; font-size:20px;">${payload}</span></b><br>`);
        }

        function stopListening() {
            clearInterval(rxInterval);
            if(microphone) microphone.disconnect();
            document.getElementById('rx-status').innerText = "Status: Idle";
            receivedBits = "";
        }

        function logConsole(msg) {
            const cons = document.getElementById('rx-console');
            cons.innerHTML += msg + "<br>";
            cons.scrollTop = cons.scrollHeight;
        }
    </script>
</body>
</html>
