<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic-Mesh: Web FSK Modem</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0d1117; color: #58a6ff; text-align: center; padding: 20px; }
        h1 { color: #00ff9d; text-shadow: 0 0 10px rgba(0,255,157,0.5); }
        .container { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: auto; }
        .panel { border: 1px solid #30363d; padding: 20px; border-radius: 8px; background: #161b22; }
        button { background-color: #238636; color: white; border: none; padding: 15px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 5px; }
        button:hover { background-color: #2ea043; }
        button.stop { background-color: #da3633; }
        input { width: 90%; padding: 10px; margin-bottom: 10px; background: #010409; color: #00ff9d; border: 1px solid #30363d; font-family: monospace; font-size: 16px;}
        #rx-console { background: #010409; color: #00ff9d; height: 200px; overflow-y: auto; text-align: left; padding: 10px; border: 1px solid #30363d; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🔊 Acoustic-Mesh Modem</h1>
    <p>Dynamic Length Self-Clocking Audio Network</p>

    <div class="container">
        <!-- SENDER PANEL -->
        <div class="panel">
            <h2 style="color: #ff7b72;">📡 Sender Mode (Node A)</h2>
            <!-- Removed maxlength. You can type as much as you want! -->
            <input type="text" id="payload" value="HELLO WORLD" placeholder="Enter text of any length">
            <br>
            <button onclick="transmitPacket()">Transmit Data</button>
        </div>

        <!-- RECEIVER PANEL -->
        <div class="panel">
            <h2 style="color: #79c0ff;">🎧 Receiver Mode (Node B)</h2>
            <button id="btn-listen" onclick="startListening()">Start Listening</button>
            <button class="stop" onclick="stopListening()">Stop / Reset</button>
            <div id="rx-status" style="margin-top:10px; color: yellow;">Status: Idle</div>
            <div id="rx-console">Waiting for audio packets...<br></div>
        </div>
    </div>

    <script>
        // --- ACOUSTIC PROTOCOL CONSTANTS ---
        const FREQ_SYNC = 3000; 
        const FREQ_1    = 2000; 
        const FREQ_0    = 1000; 

        let audioCtx;

        // ========================================================
        // SENDER: MODULATION
        // ========================================================
        async function transmitPacket() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            let text = document.getElementById('payload').value;
            
            // Layer 2/3: Add SRC(1), DST(2), Payload, and EOF Marker (#)
            const packet = `12${text}#`; 
            
            let binaryString = "";
            for (let i = 0; i < packet.length; i++) {
                binaryString += packet.charCodeAt(i).toString(2).padStart(8, '0');
            }

            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.connect(audioCtx.destination);
            
            let currentTime = audioCtx.currentTime;
            
            // 1. Initial Wakeup Preamble
            osc.frequency.setValueAtTime(FREQ_SYNC, currentTime);
            currentTime += 0.4; 

            // 2. Weave Clock Syncs between Data Bits
            for (let i = 0; i < binaryString.length; i++) {
                const freq = (binaryString[i] === '1') ? FREQ_1 : FREQ_0;
                
                osc.frequency.setValueAtTime(freq, currentTime);
                currentTime += 0.20; 
                
                osc.frequency.setValueAtTime(FREQ_SYNC, currentTime);
                currentTime += 0.15; 
            }

            // 3. Postamble Wake-Lock
            osc.frequency.setValueAtTime(FREQ_SYNC, currentTime);
            currentTime += 0.6; 

            osc.start();
            osc.stop(currentTime);
        }

        // ========================================================
        // RECEIVER: DEMODULATION & DYNAMIC FRAMING
        // ========================================================
        let analyser, microphone, rxInterval, watchdogInterval;
        let receivedBits = "";
        let recordingState = "WAIT_SYNC"; 
        let lastBitReceivedTime = 0;

        async function startListening() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('rx-status').innerText = "Status: Listening for Sync Tone... 🟢";
            receivedBits = "";
            recordingState = "WAIT_SYNC";
            lastBitReceivedTime = Date.now();
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; 
                microphone.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                const sampleRate = audioCtx.sampleRate; 
                
                // 1. CSMA/CD Idle Watchdog (Failsafe End of Packet)
                if (watchdogInterval) clearInterval(watchdogInterval);
                watchdogInterval = setInterval(() => {
                    if (receivedBits.length > 0) {
                        if (Date.now() - lastBitReceivedTime > 2000) { 
                            logConsole(`<br>⚠️ [CHANNEL IDLE] End of stream detected. Forcing Decode...`);
                            
                            // Discard incomplete bytes
                            let validLength = Math.floor(receivedBits.length / 8) * 8;
                            processPacket(receivedBits.substring(0, validLength));
                            
                            receivedBits = "";
                            recordingState = "WAIT_SYNC";
                            document.getElementById('rx-status').innerText = "Status: Listening for Sync Tone... 🟢";
                        }
                    }
                }, 1000);

                // 2. Data Polling Loop
                rxInterval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    
                    let maxIndex = 0;
                    let maxVol = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        if(dataArray[i] > maxVol) { maxVol = dataArray[i]; maxIndex = i; }
                    }
                    
                    const dominantFreq = maxIndex * sampleRate / analyser.fftSize;
                    
                    if (maxVol > 130) handleFrequency(dominantFreq);
                    
                }, 30); 

            } catch (err) {
                alert("Microphone error.");
            }
        }

        function handleFrequency(freq) {
            const isSync = Math.abs(freq - FREQ_SYNC) < 300;
            const isOne  = Math.abs(freq - FREQ_1) < 300;
            const isZero = Math.abs(freq - FREQ_0) < 300;

            if (recordingState === "WAIT_SYNC") {
                if (isSync) {
                    recordingState = "READ_BIT"; 
                    if (receivedBits.length === 0) {
                        logConsole("<br>--- Incoming Packet Detected ---");
                        document.getElementById('rx-status').innerText = "Status: Receiving Data... 🔴";
                    }
                }
            } 
            else if (recordingState === "READ_BIT") {
                if (isOne) {
                    receivedBits += "1";
                    logConsole(`Bit ${receivedBits.length} : 1`);
                    lastBitReceivedTime = Date.now(); 
                    recordingState = "WAIT_SYNC"; 
                    checkEnd();
                } else if (isZero) {
                    receivedBits += "0";
                    logConsole(`Bit ${receivedBits.length} : 0`);
                    lastBitReceivedTime = Date.now(); 
                    recordingState = "WAIT_SYNC"; 
                    checkEnd();
                }
            }
        }

        function checkEnd() {
            // Check if we just completed a full byte (8 bits)
            if (receivedBits.length > 0 && receivedBits.length % 8 === 0) {
                let lastByte = receivedBits.slice(-8);
                // "00100011" is the binary for the '#' symbol (End Of Frame)
                if (lastByte === "00100011") {
                    // Remove the '#' byte before processing the payload
                    let validPayloadBits = receivedBits.slice(0, -8);
                    processPacket(validPayloadBits);
                    
                    receivedBits = "";
                    recordingState = "WAIT_SYNC";
                    document.getElementById('rx-status').innerText = "Status: Listening for Sync Tone... 🟢";
                }
            }
        }

        function processPacket(bits) {
            let ascii = "";
            for (let i = 0; i < bits.length; i += 8) {
                let byte = bits.substring(i, i + 8);
                if(byte.length === 8) ascii += String.fromCharCode(parseInt(byte, 2));
            }
            
            let src = ascii.charAt(0);
            let dst = ascii.charAt(1);
            let payload = ascii.substring(2);
            
            logConsole(`<br><b>✅ DECODED PACKET:</b><br>[SRC: Node ${src}] [DST: Node ${dst}]<br><b>PAYLOAD: <span style="color:white; font-size:20px;">${payload}</span></b><br>`);
        }

        function stopListening() {
            clearInterval(rxInterval);
            if(watchdogInterval) clearInterval(watchdogInterval);
            if(microphone) microphone.disconnect();
            document.getElementById('rx-status').innerText = "Status: Idle";
            receivedBits = "";
        }

        function logConsole(msg) {
            const cons = document.getElementById('rx-console');
            cons.innerHTML += msg + "<br>";
            cons.scrollTop = cons.scrollHeight;
        }
    </script>
</body>
</html>
