<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic-Mesh: Web FSK Modem</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0d1117; color: #58a6ff; text-align: center; padding: 20px; }
        h1 { color: #00ff9d; text-shadow: 0 0 10px rgba(0,255,157,0.5); }
        .container { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: auto; }
        .panel { border: 1px solid #30363d; padding: 20px; border-radius: 8px; background: #161b22; }
        button { background-color: #238636; color: white; border: none; padding: 15px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 5px; }
        button:hover { background-color: #2ea043; }
        button.stop { background-color: #da3633; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; background: #010409; color: #00ff9d; border: 1px solid #30363d; font-family: monospace; font-size: 16px;}
        #rx-console { background: #010409; color: #00ff9d; height: 150px; overflow-y: auto; text-align: left; padding: 10px; border: 1px solid #30363d; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🔊 Acoustic-Mesh Modem</h1>
    <p>Layer 1-3 Air-Gapped Audio Network (Audible FSK)</p>

    <div class="container">
        <!-- SENDER PANEL -->
        <div class="panel">
            <h2 style="color: #ff7b72;">📡 Sender Mode (Node A)</h2>
            <input type="text" id="payload" value="HELLO" maxlength="5" placeholder="Enter exactly 5 chars">
            <br>
            <button onclick="transmitPacket()">Transmit Data</button>
        </div>

        <!-- RECEIVER PANEL -->
        <div class="panel">
            <h2 style="color: #79c0ff;">🎧 Receiver Mode (Node B)</h2>
            <button id="btn-listen" onclick="startListening()">Start Listening</button>
            <button class="stop" onclick="stopListening()">Stop</button>
            <div id="rx-status" style="margin-top:10px; color: yellow;">Status: Idle</div>
            <div id="rx-console">Waiting for audio packets...<br></div>
        </div>
    </div>

    <script>
        // --- ACOUSTIC PROTOCOL CONSTANTS ---
        const FREQ_SYNC = 3000; 
        const FREQ_1    = 2000; 
        const FREQ_0    = 1000; 
        const BIT_TIME  = 300; // 300ms sweet spot for mobile CPUs

        let audioCtx;

        // ========================================================
        // SENDER: MODULATION
        // ========================================================
        async function transmitPacket() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Pad text to exactly 5 chars so packet length is strictly 56 bits for demo stability
            let text = document.getElementById('payload').value;
            text = text.padEnd(5, ' ').substring(0, 5);
            
            // Layer 3: Network Encapsulation
            const packet = `12${text}`; 
            
            let binaryString = "";
            for (let i = 0; i < packet.length; i++) {
                binaryString += packet.charCodeAt(i).toString(2).padStart(8, '0');
            }

            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.connect(audioCtx.destination);
            
            let currentTime = audioCtx.currentTime;
            
            // 1. Preamble (Sync Tone)
            osc.frequency.setValueAtTime(FREQ_SYNC, currentTime);
            currentTime += (BIT_TIME * 3) / 1000;

            // 2. Data (FSK)
            for (let i = 0; i < binaryString.length; i++) {
                const freq = (binaryString[i] === '1') ? FREQ_1 : FREQ_0;
                osc.frequency.setValueAtTime(freq, currentTime);
                currentTime += BIT_TIME / 1000;
            }

            // 3. Postamble (Stop Tone)
            osc.frequency.setValueAtTime(FREQ_SYNC, currentTime);
            currentTime += (BIT_TIME * 2) / 1000;

            osc.start();
            osc.stop(currentTime);
        }

        // ========================================================
        // RECEIVER: DEMODULATION & TIMING LOCK
        // ========================================================
        let analyser, microphone, rxInterval;
        let receivedBits = "";
        let recordingState = "IDLE"; 
        let lastBitTime = 0;

        async function startListening() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('rx-status').innerText = "Status: Listening for Sync Tone... 🟢";
            
            try {
                // Disable mobile audio filters
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; 
                microphone.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                const sampleRate = audioCtx.sampleRate; 
                
                // Fast poll (50ms) to catch frequencies instantly
                rxInterval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    
                    let maxIndex = 0;
                    let maxVol = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        if(dataArray[i] > maxVol) { maxVol = dataArray[i]; maxIndex = i; }
                    }
                    
                    const dominantFreq = maxIndex * sampleRate / analyser.fftSize;
                    if (maxVol > 150) handleFrequency(dominantFreq);
                    
                }, 50); 

            } catch (err) {
                alert("Microphone error.");
            }
        }

        function handleFrequency(freq) {
            const isSync = Math.abs(freq - FREQ_SYNC) < 250;
            const isOne  = Math.abs(freq - FREQ_1) < 250;
            const isZero = Math.abs(freq - FREQ_0) < 250;
            let now = Date.now();

            if (recordingState === "IDLE" && isSync) {
                recordingState = "SYNC";
                receivedBits = "";
                document.getElementById('rx-status').innerText = "Status: Locked! Receiving Data... 🔴";
                logConsole("--- Carrier Detected ---");
                
                // Wait for the 3-bit preamble to finish before reading data
                setTimeout(() => { 
                    recordingState = "RECEIVING"; 
                    lastBitTime = Date.now() - BIT_TIME; // Allow the first bit to read instantly
                }, BIT_TIME * 2.5);
            } 
            else if (recordingState === "RECEIVING") {
                
                // TIMING LOCK: Only read a bit if ~1 full BIT_TIME has passed since the last one
                if ((isOne || isZero) && (now - lastBitTime > (BIT_TIME * 0.8))) {
                    if (isOne) {
                        receivedBits += "1";
                        logConsole("Bit: 1");
                    } else {
                        receivedBits += "0";
                        logConsole("Bit: 0");
                    }
                    lastBitTime = now; // Lock out the next read until time passes
                }
                
                // Stop Condition: Hit 56 bits (7 chars * 8 bits) OR heard the Postamble Stop Tone
                if (receivedBits.length >= 56 || (isSync && receivedBits.length > 16)) {
                    processPacket(receivedBits.substring(0, 56));
                    recordingState = "IDLE";
                    document.getElementById('rx-status').innerText = "Status: Listening for Sync Tone... 🟢";
                }
            }
        }

        function processPacket(bits) {
            logConsole("Raw bits: " + bits);
            let ascii = "";
            for (let i = 0; i < bits.length; i += 8) {
                let byte = bits.substring(i, i + 8);
                // Ensure byte is 8 bits long before parsing
                if(byte.length === 8) ascii += String.fromCharCode(parseInt(byte, 2));
            }
            
            // Decapsulation
            let src = ascii.charAt(0);
            let dst = ascii.charAt(1);
            let payload = ascii.substring(2);
            
            logConsole(`<br><b>DECODED PACKET:</b><br>[SRC: Node ${src}] [DST: Node ${dst}]<br><b>PAYLOAD: ${payload}</b><br>`);
        }

        function stopListening() {
            clearInterval(rxInterval);
            if(microphone) microphone.disconnect();
            document.getElementById('rx-status').innerText = "Status: Idle";
        }

        function logConsole(msg) {
            const cons = document.getElementById('rx-console');
            cons.innerHTML += msg + "<br>";
            cons.scrollTop = cons.scrollHeight;
        }
    </script>
</body>
</html>
